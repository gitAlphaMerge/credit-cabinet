# Каждый вечер в 21:00 МСК: итоги дня (кто что сделал, очки, MVP), табло по галочкам и напоминание о чекине.
# Работает до финала онлайн-этапа (26.10), дальше молчит сам.
name: tg-checkin

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 21:00 МСК
  workflow_dispatch:       # ручной запуск из вкладки Actions — для проверки

permissions:
  contents: read
  pull-requests: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история, чтобы понять, какие пункты закрылись за день

      - name: Итоги дня и напоминание о чекине
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD: ${{ secrets.TG_CHECKIN_THREAD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # топик чекинов ещё не задан — молчим, а не падаем
          [ -z "$TG_THREAD" ] && exit 0
          # после 26.10 итоги не нужны
          [ "$(TZ=Europe/Moscow date +%Y%m%d)" -gt 20261026 ] && exit 0
          python3 .github/scripts/digest.py
