# Деплой: каждый пуш в main → код уезжает на сервер (Yandex Cloud) и пересобирается docker compose.
# Сервер в GitHub не ходит: Actions сам заливает архив по SSH. Секреты: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER.
# Живой адрес: https://158-160-212-36.sslip.io (Caddy на сервере, вне репо; /api/* → api:8080).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # два деплоя подряд не дерутся, второй ждёт первый

jobs:
  deploy:
    # стенд выкатывает только капитан: чужой пуш в main стенд не трогает (защита веток на бесплатном плане закрыта)
    if: github.actor == 'alexregrets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ключ для сервера
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Залить код и пересобрать
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEEDBACK_EXPORT_TOKEN: ${{ secrets.FEEDBACK_EXPORT_TOKEN }}
          VPN_CLASH_PROFILE: ${{ secrets.VPN_CLASH_PROFILE }}
        run: |
          git archive --format=tar.gz HEAD -o /tmp/app.tgz
          # выход агента через VPN: из профиля берутся только узлы, пароль прокси новый на каждый деплой и нигде не печатается
          EGRESS_PASS=""; EGRESS_CFG=""
          if [ -n "$VPN_CLASH_PROFILE" ]; then
            EGRESS_PASS=$(openssl rand -hex 24); echo "::add-mask::$EGRESS_PASS"
            pip install -q pyyaml
            EGRESS_CFG=$(printf '%s' "$VPN_CLASH_PROFILE" | base64 -d | python3 scripts/build_mihomo_config.py "$EGRESS_PASS" | base64 -w0)
          fi
          scp -i ~/.ssh/deploy /tmp/app.tgz "$TARGET:/tmp/app.tgz"
          # новая папка с нуля, чтобы удалённые из репо файлы не оставались на сервере; .env сервера переносится
          printf '%s\n%s\n%s\n%s\n' "$DEEPSEEK_API_KEY" "$EGRESS_PASS" "$EGRESS_CFG" "$FEEDBACK_EXPORT_TOKEN" | ssh -i ~/.ssh/deploy "$TARGET" '
            set -e
            IFS= read -r DEEPSEEK_API_KEY
            IFS= read -r EGRESS_PASS
            IFS= read -r EGRESS_CFG
            IFS= read -r FEEDBACK_EXPORT_TOKEN
            rm -rf ~/credit-cabinet.new && mkdir ~/credit-cabinet.new
            tar xzf /tmp/app.tgz -C ~/credit-cabinet.new
            cp ~/credit-cabinet/.env ~/credit-cabinet.new/.env 2>/dev/null || true
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              touch ~/credit-cabinet.new/.env
              chmod 600 ~/credit-cabinet.new/.env
              sed -i "/^DEEPSEEK_API_KEY=/d" ~/credit-cabinet.new/.env
              printf "\nDEEPSEEK_API_KEY=%s\n" "$DEEPSEEK_API_KEY" >> ~/credit-cabinet.new/.env
              unset DEEPSEEK_API_KEY
            fi
            if [ -n "$FEEDBACK_EXPORT_TOKEN" ]; then
              touch ~/credit-cabinet.new/.env
              chmod 600 ~/credit-cabinet.new/.env
              sed -i "/^FEEDBACK_EXPORT_TOKEN=/d" ~/credit-cabinet.new/.env
              printf "\nFEEDBACK_EXPORT_TOKEN=%s\n" "$FEEDBACK_EXPORT_TOKEN" >> ~/credit-cabinet.new/.env
              unset FEEDBACK_EXPORT_TOKEN
            fi
            touch ~/credit-cabinet.new/.env && chmod 600 ~/credit-cabinet.new/.env
            sed -i "/^AGENT_LLM_PROXY=/d" ~/credit-cabinet.new/.env
            PROFILES=""
            if [ -n "$EGRESS_CFG" ]; then
              (umask 077; mkdir -p ~/credit-cabinet.new/secrets/mihomo
               printf "%s" "$EGRESS_CFG" | base64 -d > ~/credit-cabinet.new/secrets/mihomo/config.yaml)
              printf "AGENT_LLM_PROXY=http://agent:%s@egress:7890\n" "$EGRESS_PASS" >> ~/credit-cabinet.new/.env
              PROFILES="--profile egress"
            fi
            unset EGRESS_PASS EGRESS_CFG
            rm -rf ~/credit-cabinet.old && mv ~/credit-cabinet ~/credit-cabinet.old && mv ~/credit-cabinet.new ~/credit-cabinet
            cd ~/credit-cabinet
            sudo docker compose $PROFILES up --build -d --remove-orphans
            # пароль прокси новый на каждый деплой: egress обязан перечитать конфиг, иначе агент получит отказ и уйдёт в заготовки
            if [ -n "$PROFILES" ]; then sudo docker compose $PROFILES up -d --force-recreate --no-deps egress agent; fi
            sudo docker image prune -f > /dev/null
          '

      - name: Проверка, что поднялось
        run: |
          sleep 5
          curl -sf --retry 5 --retry-delay 3 https://158-160-212-36.sslip.io/api/health
          curl -sf --retry 5 --retry-delay 3 --retry-connrefused http://158.160.212.36:4173/health
