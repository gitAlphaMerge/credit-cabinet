components:
  securitySchemes:
    feedbackExport:
      type: http
      scheme: bearer
      description: FEEDBACK_EXPORT_TOKEN; сравнение за постоянное время
    cookieAuth:
      type: apiKey
      in: cookie
      name: alfa_session
  schemas:
    FeedbackInput:
      type: object
      additionalProperties: false
      required: [kind, rating]
      properties:
        kind: {type: string, enum: [message, conversation]}
        message_id:
          type: [string, 'null']
          maxLength: 200
          description: Обязателен для message, null или отсутствует для conversation
        rating:
          description: up/down/null для message; целое 1–7/null для conversation
          oneOf:
          - {type: string, enum: [up, down]}
          - {type: integer, minimum: 1, maximum: 7}
          - {type: 'null'}
        reasons:
          type: array
          maxItems: 7
          default: []
          description: Непустой массив разрешён только для down
          items: {type: string, enum: [G, L, M, P, V, F, other]}
        text: {type: string, maxLength: 1000, default: ''}
    Feedback:
      type: object
      properties:
        id: {type: string}
        chat_id: {type: string}
        message_id: {type: [string, 'null']}
        kind: {type: string, enum: [message, conversation]}
        rating:
          oneOf:
          - {type: string, enum: [up, down]}
          - {type: integer, minimum: 1, maximum: 7}
          - {type: 'null'}
        reasons: {type: array, items: {type: string, enum: [G, L, M, P, V, F, other]}}
        text: {type: string, maxLength: 1000}
        agent_mode: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        fields:
          type: object
          properties: {}
          additionalProperties:
            type: string
      required:
      - error
    Ok:
      type: object
      properties:
        ok: *id005
      required:
      - ok
    Contract:
      type: object
