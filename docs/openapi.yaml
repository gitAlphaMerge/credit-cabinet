components:
  securitySchemes:
    feedbackExport:
      type: http
      scheme: bearer
      description: FEEDBACK_EXPORT_TOKEN; сравнение за постоянное время
    cookieAuth:
      type: apiKey
      in: cookie
      name: alfa_session
  schemas:
    BankApplication:
      type: object
      required: [id, user_id, selection_id, selection_version, status, amount, term_months, purpose, version]
      properties:
        id: {type: string}
        user_id: {type: string}
        selection_id: {type: string}
        selection_version: {type: integer}
        status: {type: string, enum: [draft, queued, info_requested, underwriting, approved, offered, signed, disbursed, rejected, expired, withdrawn]}
        amount: {type: integer, minimum: 1}
        term_months: {type: integer, minimum: 1, maximum: 120}
        purpose: {type: string}
        version: {type: integer, minimum: 1}
        consent_at: {type: [string, 'null']}
        queued_at: {type: [string, 'null']}
        created_at: {type: string}
        updated_at: {type: string}
    ApplicationResult:
      type: object
      required: [application]
      properties:
        application: {$ref: '#/components/schemas/BankApplication'}
    ApplicationJournalEvent:
      type: object
      properties:
        application_id: {type: string}
        seq: {type: integer}
        event: {type: string}
        from_status: {type: [string, 'null']}
        to_status: {type: string}
        actor_role: {type: string, enum: [client, manager, system]}
        actor_id: {type: [string, 'null']}
        reason: {type: [string, 'null']}
        payload: {type: string, description: JSON string with sensitive keys stripped recursively}
        at: {type: string}
    ApplicationAlternative:
      type: object
      required: [option_id, kind, product_id, product_name, amount_rub, term_months, rate_annual_pct, monthly_payment_rub, reason]
      properties:
        option_id: {type: string}
        kind: {type: string, enum: [smaller_amount, longer_term, other_product]}
        product_id: {type: string}
        product_name: {type: string}
        amount_rub: {type: integer}
        term_months: {type: integer}
        rate_annual_pct: {type: number}
        monthly_payment_rub: {type: number}
        reason: {type: string}
    ApplicationDossier:
      type: object
      properties:
        application_id: {type: string}
        version: {type: integer}
        core_result: {type: string, description: Untouched core reply JSON, empty object when compliance blocked core}
        checks: {type: string, description: JSON map of checks plus _v2 compliance and alternatives metadata}
        holes: {type: string, description: JSON array of checklist hole keys}
        readiness_n: {type: [number, 'null']}
        readiness_m: {type: [number, 'null']}
        checklist_version: {type: [string, 'null']}
        created_at: {type: string}
        compliance: {type: object, description: Full gate report with checks including source and checkedAt, documents, reasons, holes and enrichment}
        alternatives: {type: array, items: {$ref: '#/components/schemas/ApplicationAlternative'}}
        client_objections: {type: [string, 'null']}
    BankQueueItem:
      type: object
      required: [application, priority, terms, red_reason, client_objections, alternatives, N, M, holes, checks]
      properties:
        application: {$ref: '#/components/schemas/BankApplication'}
        priority: {type: number}
        terms:
          type: object
          properties:
            amount: {type: number}
            ready: {type: number}
            holes: {type: integer}
            hours: {type: number}
            K: {type: number}
        red_reason: {enum: [CLIENT_SILENT, CLIENT_DISAGREED, null], description: Null only for legacy queue entries without escalation events}
        client_objections: {type: [string, 'null']}
        alternatives: {type: array, items: {$ref: '#/components/schemas/ApplicationAlternative'}}
        N: {type: number}
        M: {type: number}
        holes: {type: array, items: {type: string}}
        checks: {type: object}
    FeedbackInput:
      type: object
      additionalProperties: false
      required: [kind, rating]
      properties:
        kind: {type: string, enum: [message, conversation]}
        message_id:
          type: [string, 'null']
          maxLength: 200
          description: Обязателен для message, null или отсутствует для conversation
        rating:
          description: up/down/null для message; целое 1–7/null для conversation
          oneOf:
          - {type: string, enum: [up, down]}
          - {type: integer, minimum: 1, maximum: 7}
          - {type: 'null'}
        reasons:
          type: array
          maxItems: 7
          default: []
          description: Непустой массив разрешён только для down
          items: {type: string, enum: [G, L, M, P, V, F, other]}
        text: {type: string, maxLength: 1000, default: ''}
    Feedback:
      type: object
      properties:
        id: {type: string}
        chat_id: {type: string}
        message_id: {type: [string, 'null']}
        kind: {type: string, enum: [message, conversation]}
        rating:
          oneOf:
          - {type: string, enum: [up, down]}
          - {type: integer, minimum: 1, maximum: 7}
          - {type: 'null'}
        reasons: {type: array, items: {type: string, enum: [G, L, M, P, V, F, other]}}
        text: {type: string, maxLength: 1000}
        agent_mode: {type: [string, 'null']}
