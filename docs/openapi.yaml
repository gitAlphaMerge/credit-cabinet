          type: string
          enum:
          - working
          - investment
          - contract
          - overdraft
          - refinance
        cycleDays:
          type: integer
          minimum: 1
          maximum: 90
        details:
          type: object
          properties: {}
          additionalProperties:
            anyOf:
            - type: string
              maxLength: 400
            - type: number
              minimum: -1000000000000.0
              maximum: 1000000000000.0
            - *id005
            - type: 'null'
        financials:
