openapi: 3.1.0
info:
  title: 'Умный кредитный кабинет: фактический HTTP API'
  version: '2026-10-19'
  description: 'Источники: services/api/main.go, services/ml-model/{app,security,translate}.py, services/agent/server.py,
    hw/tolya/alfa-intellect/server/{app,funding-routes,funding-engine,finance}.ts. Внутренние серверы отмечены x-internal.
    Общие /health и /score различаются servers, искусственных путей нет. /api/* кабинета живут на порту 4173; /api/score
    frontend nginx ведёт в Go. Кабинет: JSON до 100 kb, cookie-сессия, запрет изменяющих запросов с чужим Origin.
    Кабинетные /api/cabinet/* не входят в этот основной набор, они реализованы в отдельном cabinet.ts. Успешные
    HTTP-ответы не означают одобрения кредита.'
servers:
- &id001
  url: http://localhost:4173
  description: alfa-intellect (ALFA_PORT)
tags:
- name: health
- name: score
- name: agent
- name: alfa-intellect
paths:
  /api/chats/{id}/feedback:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string}
    get:
      tags: [alfa-intellect]
      summary: Оценки своего чата, включая снятые оценки и закрытую итоговую карточку
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Массив оценок
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Feedback'}
        '401': {description: Требуется вход}
        '404': {description: Чат не найден или чужой}
    post:
      tags: [alfa-intellect]
      summary: Создать или перезаписать оценку своего чата
      description: 'Для message нужен существующий ответ assistant. rating null снимает оценку; для conversation — закрывает карточку. Отдельный уникальный индекс гарантирует одну итоговую карточку на пользователя и чат. agent_mode определяется сервером.'
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackInput'}
      responses:
        '200':
          description: Все оценки чата после upsert
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Feedback'}
        '401': {description: Требуется вход}
        '404': {description: Свой чат или ответ агента не найден}
        '422': {description: Неверные причины, rating, message_id или текст длиннее 1000}
  /api/admin/feedback.jsonl:
    get:
      tags: [alfa-intellect]
      summary: Оценки и реплики до оценённого ответа включительно
      description: 'JSONL: одна активная оценка, user SHA-256, messages, agent_trace. Для conversation — весь чат. ПДн заменены на [скрыто]; при недоступном агенте agent_trace null.'
      security: [{feedbackExport: []}]
      parameters:
      - in: query
        name: since
        schema: {type: string, format: date-time}
        description: Только оценки, изменённые строго после ISO-даты
      responses:
        '200':
          description: JSONL оценок
          content:
            application/x-ndjson:
              schema: {type: string}
        '404': {description: FEEDBACK_EXPORT_TOKEN не задан}
        '401': {description: Неверный Bearer токен}
        '422': {description: Неверный since}
  /api/admin/history.jsonl:
    get:
      tags: [alfa-intellect]
      summary: Вся история чатов, включая чаты без оценок
      description: 'JSONL: chat_id, user SHA-256, title, created_at, updated_at, messages с mode/status, feedback (включая закрытую итоговую карточку), status, agent_trace (trace/need/history). ПДн заменены на [скрыто]. agent_trace null при недоступном агенте. since учитывает также изменение оценки и названия чата.'
      security: [{feedbackExport: []}]
      parameters:
      - in: query
        name: since
        schema: {type: string, format: date-time}
        description: Чаты, изменённые строго после ISO-даты
      responses:
        '200':
          description: JSONL чатов
          content:
            application/x-ndjson:
              schema: {type: string}
        '404': {description: FEEDBACK_EXPORT_TOKEN не задан}
        '401': {description: Неверный Bearer токен}
        '422': {description: Неверный since}
  /admin/sessions:
    get:
      tags: [agent]
      summary: Внутренняя выгрузка сессий по SHA-256 session_id
      servers: [{url: 'http://agent:8090', x-internal: true}]
      security: [{feedbackExport: []}]
      parameters:
      - in: query
        name: ids
        required: true
        description: От 1 до 200 session_id через запятую, каждый до 200 символов
        schema: {type: string}
      responses:
        '200':
          description: Объект session_id → trace/need/history либо null. statement_csv исключён рекурсивно.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: [object, 'null']
                  properties:
                    trace: {type: array, items: {type: object}}
                    need: {type: object}
                    history: {type: array, items: {type: object}}
        '400': {description: Неверный список ids}
        '404': {description: FEEDBACK_EXPORT_TOKEN не задан}
        '401': {description: Неверный Bearer токен}
  /health:
    get:
      summary: Здоровье сервисов
      tags:
      - health
      description: 'Один путь у четырёх серверов. Go: только status. ml-model: core_id/model_version. agent: ok/llm/started_at/turns.
        Кабинет: db/team_api/storage/schema; degraded всё ещё HTTP 200.'
      servers:
      - &id002
        url: http://localhost:8080
        description: Go API, прямые /health и /score
      - &id003
        url: http://127.0.0.1:5000
        description: 'ml-model: loopback хоста или http://ml-model:5000 внутри Compose'
        x-internal: true
      - &id004
        url: http://agent:8090
        description: Только внутренняя сеть Compose
        x-internal: true
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GoHealth'
                - $ref: '#/components/schemas/ModelHealth'
                - $ref: '#/components/schemas/AgentHealth'
                - $ref: '#/components/schemas/CabinetHealth'
      x-service-responses:
        api: '#/components/schemas/GoHealth'
        ml-model: '#/components/schemas/ModelHealth'
        agent: '#/components/schemas/AgentHealth'
        alfa-intellect: '#/components/schemas/CabinetHealth'
  /score:
    post:
      summary: Расчёт командного ядра
      tags:
      - score
      description: Go проксирует без изменения тела; лимит Go 6 MiB, ml-model 5 MiB; таймаут Go 30 с. Нужны JSON
        и Content-Length. ml-model внутри помечен x-internal на server.
      servers:
      - *id002
      - url: http://localhost/api
        description: frontend nginx, срезает префикс /api
      - *id003
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '411':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Превышен размер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
  /turn:
    post:
      summary: Один ход агента
      tags:
      - agent
      description: 'Состояние по session_id. Только text/card; файлы не принимаются. Ошибки LLM дают fallback, ошибки
        HTTP адаптера: 500.'
      servers:
      - *id004
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      x-internal: true
  /api/health:
    get:
      summary: Здоровье кабинета
      tags:
      - health
      description: Здоровье кабинета
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CabinetHealth'
  /api/config:
    get:
      summary: Конфигурация интерфейса
      tags:
      - alfa-intellect
      description: aiConnected отражает только OPENAI_API_KEY, а не доступность TEAM_AGENT_URL.
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: &id005
                    type: boolean
                  workspaceId:
                    anyOf:
                    - type: string
                    - type: 'null'
                  aiConnected: *id005
                  model:
                    type: string
                  fieldNames:
                    type: object
                    properties: {}
                  catalog:
                    type: array
                    items:
                      type: object
                      properties: {}
  /api/public-demo:
    get:
      summary: Публичное демо без сессии
      tags:
      - alfa-intellect
      description: Публичное демо без сессии
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppState'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - ooo
          - ip
          - idea
        description: По умолчанию ooo
  /api/public-demo/calculate:
    post:
      summary: Пересчёт публичного примера
      tags:
      - alfa-intellect
      description: Пересчёт публичного примера
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - ooo
                  - ip
                  - idea
                amount:
                  type: number
                  minimum: 10000
                  maximum: 100000000.0
                term:
                  type: integer
                  minimum: 1
                  maximum: 120
              required:
              - kind
              - amount
              - term
              additionalProperties: false
  /api/auth/register:
    post:
      summary: Создать синтетическую учётку
      tags:
      - alfa-intellect
      description: Создать синтетическую учётку
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: alfa_session, HttpOnly, SameSite=Strict, Path=/, срок 7 дней; Secure по COOKIE_SECURE
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт версии или состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
  /api/auth/login:
    post:
      summary: Вход
      tags:
      - alfa-intellect
      description: Вход
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: alfa_session, HttpOnly, SameSite=Strict, Path=/, срок 7 дней; Secure по COOKIE_SECURE
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /api/auth/demo:
    post:
      summary: Создать отдельное демо-пространство
      tags:
      - alfa-intellect
      description: Создать отдельное демо-пространство
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: alfa_session, HttpOnly, SameSite=Strict, Path=/, срок 7 дней; Secure по COOKIE_SECURE
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - ooo
                  - ip
                  - idea
              description: kind по умолчанию ooo
  /api/auth/logout:
    post:
      summary: Завершить сессию
      tags:
      - alfa-intellect
      description: Завершить сессию
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
  /api/state:
    get:
      summary: Полное состояние кабинета
      tags:
      - alfa-intellect
      description: Синхронизирует уведомления и сохраняет JSON AppState.
      servers:
      - *id001
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppState'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/profile:
    patch:
      summary: Обновить профиль
      tags:
      - alfa-intellect
      description: Обновить профиль
      servers:
      - *id001
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppState'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 160
                  minLength: 1
                sector:
                  type: string
                  maxLength: 160
                activity:
                  type: string
                  maxLength: 160
                region:
                  type: string
                  maxLength: 100
                ageBand:
                  type: string
                  maxLength: 80
                result:
                  type: string
                  maxLength: 100
                debt:
                  type: string
                  maxLength: 80
                intent:
                  type: string
                  maxLength: 160
              additionalProperties: false
  /api/preferences:
    patch:
      summary: Настройки интерфейса
      tags:
      - alfa-intellect
      description: Настройки интерфейса
      servers:
      - *id001
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppState'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                split:
                  type: number
                  minimum: 40
                  maximum: 75
                tourDone: *id005
  /api/lookup:
    post:
      summary: Поиск компании по ИНН
      tags:
      - alfa-intellect
      description: 'В Compose локальный мок. ИНН: 9900000001, 9900000002, 990000000001, 990000000002. Кандидат сохраняется
        в памяти на 10 минут.'
      servers:
      - *id001
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryRecord'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema: &id006
              type: object
              properties:
                inn:
                  type: string
                  pattern: ^(\d{10}|\d{12})$
              required:
              - inn
  /api/lookup/confirm:
    post:
      summary: Подтвердить найденную компанию
      tags:
      - alfa-intellect
      description: В теле нужен совпадающий inn; поля профиля берутся из свежего серверного кандидата, не из тела.
      servers:
      - *id001
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppState'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт версии или состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id006
  /api/documents:
    post:
      summary: Загрузить и извлечь документ
      tags:
      - alfa-intellect
      description: Один file, до 8 MiB, memoryStorage. Извлечение CSV/XLSX/PDF/DOCX; неподдержанные или неполные
        поля дают 400. Повтор того же файла возвращает прежний документ.
      servers:
      - *id001
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
