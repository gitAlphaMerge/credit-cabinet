              anyOf:
              - type: number
                minimum: 0
                maximum: 1000000000000.0
              - type: 'null'
            expenses:
              anyOf:
              - type: number
                minimum: 0
                maximum: 1000000000000.0
              - type: 'null'
            existing:
              anyOf:
              - type: number
                minimum: 0
                maximum: 1000000000000.0
              - type: 'null'
            available:
              anyOf:
              - type: number
                minimum: 0
                maximum: 1000000000000.0
              - type: 'null'
            flow:
              anyOf:
              - type: number
                minimum: -1000000000000.0
                maximum: 1000000000000.0
              - type: 'null'
            changes:
              anyOf:
              - type: number
                minimum: -1000000000000.0
                maximum: 1000000000000.0
              - type: 'null'
          additionalProperties: false
