openapi: 3.1.0
info:
  title: 'Умный кредитный кабинет: фактический HTTP API'
  version: '2026-10-19'
  description: 'Источники: services/api/main.go, services/ml-model/{app,security,translate}.py, services/agent/server.py,
    hw/tolya/alfa-intellect/server/{app,funding-routes,funding-engine,finance}.ts. Внутренние серверы отмечены x-internal.
    Общие /health и /score различаются servers, искусственных путей нет. /api/* кабинета живут на порту 4173; /api/score
    frontend nginx ведёт в Go. Кабинет: JSON до 100 kb, cookie-сессия, запрет изменяющих запросов с чужим Origin.
    Кабинетные /api/cabinet/* не входят в этот основной набор, они реализованы в отдельном cabinet.ts. Успешные
    HTTP-ответы не означают одобрения кредита.'
servers:
- &id001
  url: http://localhost:4173
  description: alfa-intellect (ALFA_PORT)
tags:
- name: health
- name: score
- name: agent
- name: alfa-intellect
paths:
  /api/applications:
    post:
      tags: [alfa-intellect]
      summary: Create a bank application draft from an owned selection version
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selectionId, selectionVersion]
              properties:
                selectionId: {type: string, minLength: 1, maxLength: 128}
                selectionVersion: {type: integer, minimum: 1}
                parent_id: {type: string, description: Owned rejected parent application}
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationResult'}
        '401': {description: Authentication required}
        '403': {description: Client role required}
        '404': {description: Owned selection or parent not found}
        '409': {description: Selection version or parent status conflict}
        '422': {description: Invalid principal or term}
    get:
      tags: [alfa-intellect]
      security: [{cookieAuth: []}]
      summary: List own client applications
      responses:
        '200':
          description: Owned applications ordered by created_at and id
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BankApplication'}}
        '401': {description: Authentication required}
        '403': {description: Client role required}
  /api/applications/{id}:
    parameters:
    - {in: path, name: id, required: true, schema: {type: string}}
    get:
      tags: [alfa-intellect]
      security: [{cookieAuth: []}]
      summary: Read application, journal and latest dossier
      responses:
        '200':
          description: Client owns application or caller is manager
          content:
            application/json:
              schema:
                type: object
                required: [application, events, dossier, alternative]
                properties:
                  application: {$ref: '#/components/schemas/BankApplication'}
                  events: {type: array, items: {$ref: '#/components/schemas/ApplicationJournalEvent'}}
                  dossier:
                    anyOf:
                    - {$ref: '#/components/schemas/ApplicationDossier'}
                    - {type: 'null'}
                  alternative: {type: [object, 'null'], description: Legacy manager rejection alternative}
        '401': {description: Authentication required}
        '404': {description: Not found or foreign client application}
  /api/applications/{id}/events:
    parameters:
    - {in: path, name: id, required: true, schema: {type: string}}
    - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    post:
      tags: [alfa-intellect]
      security: [{cookieAuth: []}]
      summary: Apply a guarded application event with atomic automatic cascade
      description: >-
        submit requires payload.consent=true. client_update requires confirmed_fields or documents;
        stored user documents supply scoring evidence. accept_alternative requires option_id from
        the latest dossier and reruns compliance, core and BKI with the option amount and term.
        Green results return offered after three system events. Hard stops return rejected,
        incomplete evidence and excessive principal return info_requested. agent_nudge requires text;
        escalate_silent requires a nudge after the latest info cycle; escalate_disagreed requires
        client_objections. These three agent events can be delegated only by the owning client session,
        and are recorded as system. Manager request_info/reject require reason; send_to_underwriting
        requires memo and a complete dossier within limit and cascades to offered. Client sign with
        code 0000 cascades to disbursed. Other system events are internal only. Role comes from the
        session database, never from request payload. Exact Idempotency-Key replay returns the original
        response without rescoring, including stale expectedVersion. Conflicting key reuse returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event, expectedVersion]
              properties:
                event:
                  type: string
                  enum: [create, submit, request_info, client_update, reject, send_to_underwriting,
                    underwriter_approve, make_offer, sign, disburse, expire, withdraw,
                    accept_alternative, agent_nudge, escalate_silent, escalate_disagreed]
                expectedVersion: {type: integer, minimum: 1}
                reason: {type: string, maxLength: 4000}
                payload: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Final committed application or idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationResult'}
        '401': {description: Authentication required}
        '403': {description: Forbidden role or internal system event}
        '404': {description: Application absent or foreign}
        '409': {description: Invalid transition, stale version, missing nudge or AMOUNT_EXCEEDS_LIMIT}
        '422': {description: Invalid payload, unknown option_id or conflicting idempotency key}
        '500': {description: Transaction failed and all writes rolled back}
        '503': {description: Compliance or core unavailable; no application writes committed}
  /api/bank/queue:
    get:
      tags: [alfa-intellect]
      security: [{cookieAuth: []}]
      summary: Red queued applications only, sorted by priority
      description: >-
        Principal for priority is min(amount, limit_now_rub), or zero without a scored limit.
        Priority = principal * (N/M) / (1+holes.length) + PRIORITY_AGING_K * hours.
        Ties use queued_at then application id. info_requested and rejected are excluded.
      responses:
        '200':
          description: Manager queue
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BankQueueItem'}}
        '401': {description: Authentication required}
        '403': {description: Manager role required}
        '503': {description: Dossier or completeness metadata missing}
  /api/bank/rejected:
    get:
      tags: [alfa-intellect]
      security: [{cookieAuth: []}]
      summary: Rejected applications with reason, separate from the active queue
      responses:
        '200':
          description: Rejected applications ordered by updated_at then id
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - {$ref: '#/components/schemas/BankApplication'}
                  - type: object
                    properties:
                      red_reason: {const: UNDERWRITING_REJECTED}
                      reason: {type: [string, 'null']}
        '401': {description: Authentication required}
        '403': {description: Manager role required}
  /api/chats/{id}/feedback:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string}
    get:
      tags: [alfa-intellect]
      summary: Оценки своего чата, включая снятые оценки и закрытую итоговую карточку
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Массив оценок
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Feedback'}
        '401': {description: Требуется вход}
        '404': {description: Чат не найден или чужой}
    post:
      tags: [alfa-intellect]
      summary: Создать или перезаписать оценку своего чата
      description: 'Для message нужен существующий ответ assistant. rating null снимает оценку; для conversation — закрывает карточку. Отдельный уникальный индекс гарантирует одну итоговую карточку на пользователя и чат. agent_mode определяется сервером.'
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackInput'}
      responses:
        '200':
          description: Все оценки чата после upsert
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Feedback'}
        '401': {description: Требуется вход}
        '404': {description: Свой чат или ответ агента не найден}
        '422': {description: Неверные причины, rating, message_id или текст длиннее 1000}
  /api/admin/feedback.jsonl:
    get:
      tags: [alfa-intellect]
      summary: Оценки и реплики до оценённого ответа включительно
      description: 'JSONL: одна активная оценка, user SHA-256, messages, agent_trace. Для conversation — весь чат. ПДн заменены на [скрыто]; при недоступном агенте agent_trace null.'
      security: [{feedbackExport: []}]
      parameters:
      - in: query
        name: since
        schema: {type: string, format: date-time}
        description: Только оценки, изменённые строго после ISO-даты
      responses:
        '200':
          description: JSONL оценок
          content:
            application/x-ndjson:
              schema: {type: string}
        '404': {description: FEEDBACK_EXPORT_TOKEN не задан}
        '401': {description: Неверный Bearer токен}
        '422': {description: Неверный since}
  /api/admin/history.jsonl:
    get:
      tags: [alfa-intellect]
      summary: Вся история чатов, включая чаты без оценок
      description: 'JSONL: chat_id, user SHA-256, title, created_at, updated_at, messages с mode/status, feedback (включая закрытую итоговую карточку), status, agent_trace (trace/need/history). ПДн заменены на [скрыто]. agent_trace null при недоступном агенте. since учитывает также изменение оценки и названия чата.'
      security: [{feedbackExport: []}]
      parameters:
      - in: query
        name: since
        schema: {type: string, format: date-time}
        description: Чаты, изменённые строго после ISO-даты
      responses:
        '200':
          description: JSONL чатов
          content:
            application/x-ndjson:
              schema: {type: string}
        '404': {description: FEEDBACK_EXPORT_TOKEN не задан}
        '401': {description: Неверный Bearer токен}
        '422': {description: Неверный since}
  /admin/sessions:
    get:
      tags: [agent]
      summary: Внутренняя выгрузка сессий по SHA-256 session_id
      servers: [{url: 'http://agent:8090', x-internal: true}]
      security: [{feedbackExport: []}]
      parameters:
      - in: query
        name: ids
        required: true
        description: От 1 до 200 session_id через запятую, каждый до 200 символов
        schema: {type: string}
      responses:
        '200':
          description: Объект session_id → trace/need/history либо null. statement_csv исключён рекурсивно.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: [object, 'null']
                  properties:
                    trace: {type: array, items: {type: object}}
                    need: {type: object}
                    history: {type: array, items: {type: object}}
        '400': {description: Неверный список ids}
        '404': {description: FEEDBACK_EXPORT_TOKEN не задан}
        '401': {description: Неверный Bearer токен}
  /health:
    get:
      summary: Здоровье сервисов
      tags:
      - health
      description: 'Один путь у четырёх серверов. Go: только status. ml-model: core_id/model_version. agent: ok/llm/started_at/turns.
        Кабинет: db/team_api/storage/schema; degraded всё ещё HTTP 200.'
      servers:
      - &id002
        url: http://localhost:8080
        description: Go API, прямые /health и /score
      - &id003
        url: http://127.0.0.1:5000
        description: 'ml-model: loopback хоста или http://ml-model:5000 внутри Compose'
        x-internal: true
      - &id004
        url: http://agent:8090
        description: Только внутренняя сеть Compose
        x-internal: true
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GoHealth'
                - $ref: '#/components/schemas/ModelHealth'
                - $ref: '#/components/schemas/AgentHealth'
                - $ref: '#/components/schemas/CabinetHealth'
      x-service-responses:
        api: '#/components/schemas/GoHealth'
        ml-model: '#/components/schemas/ModelHealth'
        agent: '#/components/schemas/AgentHealth'
        alfa-intellect: '#/components/schemas/CabinetHealth'
  /score:
    post:
      summary: Расчёт командного ядра
      tags:
      - score
      description: Go проксирует без изменения тела; лимит Go 6 MiB, ml-model 5 MiB; таймаут Go 30 с. Нужны JSON
        и Content-Length. ml-model внутри помечен x-internal на server.
      servers:
      - *id002
      - url: http://localhost/api
        description: frontend nginx, срезает префикс /api
      - *id003
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '411':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Превышен размер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
  /turn:
    post:
      summary: Один ход агента
      tags:
      - agent
      description: 'Состояние по session_id. Только text/card; файлы не принимаются. Ошибки LLM дают fallback, ошибки
        HTTP адаптера: 500.'
      servers:
      - *id004
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      x-internal: true
  /api/health:
    get:
      summary: Здоровье кабинета
      tags:
      - health
      description: Здоровье кабинета
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CabinetHealth'
  /api/config:
    get:
      summary: Конфигурация интерфейса
      tags:
      - alfa-intellect
      description: aiConnected отражает только OPENAI_API_KEY, а не доступность TEAM_AGENT_URL.
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: &id005
                    type: boolean
                  workspaceId:
                    anyOf:
                    - type: string
                    - type: 'null'
                  aiConnected: *id005
                  model:
                    type: string
                  fieldNames:
                    type: object
                    properties: {}
                  catalog:
                    type: array
                    items:
                      type: object
                      properties: {}
  /api/public-demo:
    get:
      summary: Публичное демо без сессии
      tags:
      - alfa-intellect
      description: Публичное демо без сессии
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppState'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - ooo
          - ip
          - idea
        description: По умолчанию ooo
  /api/public-demo/calculate:
    post:
      summary: Пересчёт публичного примера
      tags:
      - alfa-intellect
      description: Пересчёт публичного примера
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - ooo
                  - ip
                  - idea
                amount:
                  type: number
                  minimum: 10000
                  maximum: 100000000.0
                term:
                  type: integer
                  minimum: 1
                  maximum: 120
              required:
              - kind
              - amount
              - term
              additionalProperties: false
  /api/auth/register:
    post:
      summary: Создать синтетическую учётку
      tags:
      - alfa-intellect
      description: Создать синтетическую учётку
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: alfa_session, HttpOnly, SameSite=Strict, Path=/, срок 7 дней; Secure по COOKIE_SECURE
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт версии или состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
  /api/auth/login:
    post:
      summary: Вход
      tags:
      - alfa-intellect
      description: Вход
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: alfa_session, HttpOnly, SameSite=Strict, Path=/, срок 7 дней; Secure по COOKIE_SECURE
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /api/auth/jury:
    post:
      summary: Вход жюри в готовую компанию
      tags:
      - alfa-intellect
      description: Общий логин и пароль жюри (JURY_LOGIN, JURY_PASSWORD) плюс персона из shared/demo-personas.ts. Клиентская компания при первом входе проходит путь заявки через ядро; повторный вход открывает ту же компанию. Персона manager входит с ролью менеджера.
      servers:
      - *id001
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
                persona:
                  type: string
                  description: green, gap, document, review, young или manager; без неё первая клиентская компания
              required:
              - login
              - password
      responses:
        '200':
          description: Сессия создана, destination — куда перейти (/cabinet, /apply или /bank)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  destination:
                    type: string
          headers:
            Set-Cookie:
              schema:
                type: string
              description: alfa_session, HttpOnly, SameSite=Strict, Path=/, срок 7 дней; Secure по COOKIE_SECURE
        '400':
          description: Такой тестовой компании нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный логин или пароль жюри
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/demo:
    post:
      summary: Создать отдельное демо-пространство
      tags:
      - alfa-intellect
      description: Создать отдельное демо-пространство
      servers:
      - *id001
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: alfa_session, HttpOnly, SameSite=Strict, Path=/, срок 7 дней; Secure по COOKIE_SECURE
        '400':
          description: Ошибка ввода/обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка Zod-валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
