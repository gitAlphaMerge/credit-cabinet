<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="Дизайн-система Живой узор v2">
<style>:root{--bg:#f3f4f5;--card:#fff;--ink:#0b0b0c;--ink2:#6b6b70;--line:#dcdcdd;--rs:#fbe8e7;--rt:#b8200f;--bs:#d6e8fc;--bt:#0058b8}@media (prefers-color-scheme:dark){:root{--bg:#0e0e10;--card:#18181b;--ink:#f2f2f3;--ink2:#9a9aa2;--line:#2c2c30;--rs:#3a1714;--rt:#ff7a6e;--bs:#12233a;--bt:#7fb6ff}}text{font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif}.bg{fill:var(--bg)}.card{fill:var(--card)}.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.rt{fill:var(--rt)}.bt{fill:var(--bt)}.rs{fill:var(--rs)}.bs{fill:var(--bs)}.line{fill:var(--line)}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/></filter></defs>
<rect class="bg" width="1280" height="250" rx="28"/>

<text x="64" y="54" class="ink" font-size="22" font-weight="800">Живой узор v2</text>
<text x="256" y="54" class="ink2" font-size="15" font-weight="500">три цвета, у каждого одна роль · Manrope · радиус 16 · тень вместо рамки</text>
<g filter="url(#sh)"><rect x="64" y="80" width="360" height="130" rx="16" class="card"/></g><rect x="84" y="100" width="56" height="56" rx="12" fill="#ef3124"/><rect x="146" y="100" width="28" height="56" rx="8" fill="#fbe8e7"/><text x="192" y="122" class="ink" font-size="17" font-weight="800">Красный #ef3124</text><text x="192" y="146" class="ink2" font-size="14">действие и внимание</text><text x="84" y="190" class="ink2" font-size="13">насыщенный только на главной кнопке</text><g filter="url(#sh)"><rect x="460" y="80" width="360" height="130" rx="16" class="card"/></g><rect x="480" y="100" width="56" height="56" rx="12" fill="#0072ef"/><rect x="542" y="100" width="28" height="56" rx="8" fill="#d6e8fc"/><text x="588" y="122" class="ink" font-size="17" font-weight="800">Синий #0072ef</text><text x="588" y="146" class="ink2" font-size="14">данные, рост, подтверждённое</text><text x="480" y="190" class="ink2" font-size="13">синтетика помечена синим бейджем</text><g filter="url(#sh)"><rect x="856" y="80" width="360" height="130" rx="16" class="card"/></g><rect x="876" y="100" width="56" height="56" rx="12" fill="#13a463"/><rect x="938" y="100" width="28" height="56" rx="8" fill="#e7f6ef"/><text x="984" y="122" class="ink" font-size="17" font-weight="800">Зелёный #13a463</text><text x="984" y="146" class="ink2" font-size="14">только «готово»</text><text x="876" y="190" class="ink2" font-size="13">жёлтого и светофора нет</text>

</svg>
