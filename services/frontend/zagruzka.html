<style>
/* 3 · загрузка: Figma «3 страница» 72:2. Пуш танцует, пока грузится; после анкеты → кабинет с туром */
.load { min-height: calc(100vh - 67px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px 16px 48px; }
.push { width: min(560px, 80vw); aspect-ratio: 1; object-fit: contain; animation: dance 1.1s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes dance {
  0%, 100% { transform: rotate(-4deg) translateY(0); }
  25% { transform: rotate(0) translateY(-14px); }
  50% { transform: rotate(4deg) translateY(0); }
  75% { transform: rotate(0) translateY(-8px); }
}
.load-cap { background: var(--accent); color: #fff; border-radius: 20px; padding: 18px 40px; font-size: 22px; font-weight: 600; letter-spacing: .08em; text-align: center; max-width: 675px; width: 100%; }
@media (max-width: 960px) { .load-cap { font-size: 17px; padding: 14px 20px; letter-spacing: .04em; } }
@media (prefers-reduced-motion: reduce) { .push { animation: none; } }
</style>
</head>
