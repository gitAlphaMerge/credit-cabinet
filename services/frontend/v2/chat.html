<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-чат v2 · навыки и голос</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f3f4f5}
a{color:#0072ef}a:hover{color:#005bbf}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes slideOrb{from{left:0%}}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes halo{0%{transform:scale(.8);opacity:.55}100%{transform:scale(1.6);opacity:0}}
.msg{animation:msgIn .35s cubic-bezier(.2,.7,.2,1) both}
.spin{animation:orbit 1.2s linear infinite}
.idle{animation:orbit 9s linear infinite}
.core{animation:breathe 2.4s ease-in-out infinite}
.bar{animation:fill 3.6s cubic-bezier(.4,0,.2,1) both}
.col{transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.7,.2,1) both}
.orbpos{animation:slideOrb 1.1s cubic-bezier(.2,.8,.2,1) both}
.mic .w1,.mic .w2,.mic .w3,.mic .w4,.mic .w5{animation-duration:2.4s!important}
.mic:hover .w1,.mic:hover .w2,.mic:hover .w3,.mic:hover .w4,.mic:hover .w5{animation-duration:.7s!important}
.w1{animation:wave .9s ease-in-out infinite}.w2{animation:wave .9s .12s ease-in-out infinite}.w3{animation:wave .9s .24s ease-in-out infinite}.w4{animation:wave .9s .36s ease-in-out infinite}.w5{animation:wave .9s .48s ease-in-out infinite}
.halo{animation:halo 2s ease-out infinite}.halo2{animation:halo 2s 1s ease-out infinite}
.chip:hover{background:#f7d3d0}
.row:hover{background:#f3f4f5}
.ghost:hover{background:#f3f4f5}
.cta:hover{background:#d92a1e}

@keyframes sp1{0%,12%{transform:translate(0,0) scale(1)}40%,62%{transform:translate(-19px,-19px) scale(.5)}90%,100%{transform:translate(0,0) scale(1)}}
@keyframes sp2{0%,12%{transform:translate(0,0) scale(1)}40%,62%{transform:translate(19px,-19px) scale(.5)}90%,100%{transform:translate(0,0) scale(1)}}
@keyframes sp3{0%,12%{transform:translate(0,0) scale(1)}40%,62%{transform:translate(-19px,19px) scale(.5)}90%,100%{transform:translate(0,0) scale(1)}}
@keyframes sp4{0%,12%{transform:translate(0,0) scale(1)}40%,62%{transform:translate(19px,19px) scale(.5)}90%,100%{transform:translate(0,0) scale(1)}}
@keyframes idea1{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(0,-36px) scale(1);opacity:0}}
@keyframes idea2{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(34px,-12px) scale(1);opacity:0}}
@keyframes idea3{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(21px,29px) scale(1);opacity:0}}
@keyframes idea4{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(-21px,29px) scale(1);opacity:0}}
@keyframes idea5{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(-34px,-12px) scale(1);opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes puff{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.th-sat{animation:rot 3.2s linear infinite}.th-moon{animation:rot 1.1s linear infinite}
.th-s1{animation:sp1 2.8s cubic-bezier(.65,0,.35,1) infinite}.th-s2{animation:sp2 2.8s cubic-bezier(.65,0,.35,1) infinite}.th-s3{animation:sp3 2.8s cubic-bezier(.65,0,.35,1) infinite}.th-s4{animation:sp4 2.8s cubic-bezier(.65,0,.35,1) infinite}
.th-i1{animation:idea1 2.4s cubic-bezier(.16,1,.3,1) infinite}.th-i2{animation:idea2 2.4s .48s cubic-bezier(.16,1,.3,1) infinite}.th-i3{animation:idea3 2.4s .96s cubic-bezier(.16,1,.3,1) infinite}.th-i4{animation:idea4 2.4s 1.44s cubic-bezier(.16,1,.3,1) infinite}.th-i5{animation:idea5 2.4s 1.92s cubic-bezier(.16,1,.3,1) infinite}
.th-puff{animation:puff 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.th-sat,.th-moon,.th-s1,.th-s2,.th-s3,.th-s4,.th-i1,.th-i2,.th-i3,.th-i4,.th-i5,.th-puff{animation:none}}
@media (prefers-reduced-motion: reduce){.msg,.spin,.idle,.core,.bar,.col,.orbpos,.w1,.w2,.w3,.w4,.w5,.halo,.halo2{animation:none}}
.seg:not([aria-current]):hover{background:#e4e4e6!important}
.callbtn:hover{background:#0f8c54}
</style>
<style>[v-cloak]{display:none}</style>
</head>
<body>
<div id="app" v-cloak>
<input id="statement-file" type="file" accept=".csv" @change="v.selectFile" hidden>
<div style="min-height: 900px; display: flex; flex-direction: column; font-family: 'Manrope', system-ui, sans-serif; color: #0b0b0c; background: #f3f4f5">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; padding: 12px 44px; background: #ffffff; border-bottom: 1px solid #dcdcdd">
<div style="display: flex; align-items: center; gap: 10px">
<img src="img/alfa.svg" alt="" style="width: 28px; height: 28px">
<span style="font-weight: 800; font-size: 17px">Альфа-Бизнес</span>
</div>
<nav aria-label="Разделы" style="display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 999px; background: #f3f4f5; margin-left: auto"><a href="index.html" class="seg" style="min-height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 700; background: transparent; color: #0b0b0c">Главная</a><a href="kabinet.html" class="seg" style="min-height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 700; background: transparent; color: #0b0b0c">Кредитный кабинет</a><a href="chat.html" aria-current="page" class="seg" style="min-height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 700; background: #0b0b0c; color: #ffffff">ИИ-агент</a><a href="podbor.html" class="seg" style="min-height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 700; background: transparent; color: #0b0b0c">Подбор</a></nav>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Уведомления, 2 новых" class="ghost" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #dcdcdd; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
<span style="position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 999px; background: #ef3124; border: 2px solid #ffffff"></span>
</button>
<button type="button" aria-label="Профиль" class="ghost" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #dcdcdd; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
</button>
</div>
</header>

<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: stretch">

<aside style="flex: 1 1 280px; max-width: 312px; min-width: 260px; background: #ffffff; border-right: 1px solid #dcdcdd; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<button type="button" class="cta" @click="v.reset" style="height: 48px; border: 0; border-radius: 12px; background: #ef3124; color: #ffffff; font: 800 18px 'Manrope', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Новый чат
</button>
<label style="display: flex; align-items: center; gap: 8px; height: 40px; border: 1px solid #dcdcdd; border-radius: 12px; padding: 0 12px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" placeholder="Поиск по чатам" aria-label="Поиск по чатам" style="border: 0; outline: none; font: 400 14px 'Manrope', sans-serif; flex: 1 1 auto; min-width: 0; background: transparent">
</label>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 0">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b6b70">Навыки агента</span>
<button type="button" @click="v.openDb" style="border: 0; background: transparent; color: #0072ef; font: 700 13px 'Manrope', sans-serif; cursor: pointer; min-height: 32px">База навыков · 12</button>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<template v-for="(k, $index) in v.skills">
<button type="button" class="row" @click="k.pick" :style="`text-align: left; border: 0; background: ${k.bg}; border-radius: 12px; padding: 8px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 10px; min-height: 48px`">
<span :style="`width: 32px; height: 32px; flex: 0 0 32px; border-radius: 12px; background: ${k.tint}; display: flex; align-items: center; justify-content: center`">
<img :src="k.img" alt="" style="width: 20px; height: 20px">
</span>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 14px; font-weight: 700; color: #0b0b0c">{{ k.title }}</span>
<span style="font-size: 12px; color: #6b6b70">{{ k.sub }}</span>
</span>
</button>
</template>
</div>

<span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b6b70; padding: 6px 6px 0">История</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<template v-for="(h, $index) in v.history">
<button type="button" class="row" :style="`text-align: left; border: 0; background: ${h.bg}; border-radius: 12px; padding: 9px 8px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: space-between; gap: 8px`">
<span style="font-size: 14px; font-weight: 600; color: #0b0b0c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ h.title }}</span>
<span style="font-size: 12px; color: #6b6b70; flex: 0 0 auto">{{ h.when }}</span>
</button>
</template>
</div>

<span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b6b70; padding: 6px 6px 0">Мои подборы</span>
<div style="border: 1px solid #dcdcdd; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 700">Подбор от 17 окт</span>
<span style="font-size: 13px; color: #6b6b70">3 варианта, лучший после шага</span>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: #ffffff; position: relative">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 24px; border-bottom: 1px solid #dcdcdd">
<div style="display: flex; align-items: center; gap: 12px; flex: 1 1 auto">
<svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true" style="flex: 0 0 40px"><circle cx="50" cy="50" r="35" fill="none" stroke="#fbe8e7" stroke-width="5"></circle><circle class="core" cx="50" cy="50" r="24" fill="#ef3124" style="transform-origin: 50px 50px"></circle><g :class="v.mascotClass" style="transform-origin: 50px 50px"><circle cx="85" cy="50" r="7" fill="#ef3124"></circle></g></svg>
<div style="display: flex; flex-direction: column">
<span style="font-size: 17px; font-weight: 800">{{ v.chatTitle }}</span>
<span style="font-size: 13px; color: #6b6b70">{{ v.statusLine }}</span>
</div>
</div>
<button type="button" class="ghost" @click="v.toggleVoice" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #dcdcdd; background: #ffffff; display: flex; align-items: center; gap: 8px; font: 600 14px 'Manrope', sans-serif; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0b0c" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
Голосом
</button>
<a href="#" class="ghost" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #dcdcdd; display: flex; align-items: center; gap: 8px; color: #0b0b0c; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0b0c" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M5 20c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5"></path></svg>
Позвать менеджера
</a>
</div>

<div style="flex: 1 1 auto; height: 600px; overflow-y: auto; padding: 24px 24px 12px">
<div style="max-width: 824px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px">

<template v-if="v.isEmpty">
<div class="msg" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 36px 0 18px; text-align: center">
<span style="font-size: 28px; font-weight: 800; letter-spacing: -.02em">Чем помочь вашему бизнесу?</span>
<span style="font-size: 15px; color: #6b6b70; max-width: 460px">Считаю по выписке, а не по словам. Решение о кредите принимает банк, я готовлю цифры и заявку.</span>
</div>
</template>

<template v-for="(m, $index) in v.messages"><div style="display: contents">
<template v-if="m.agent">
<div class="msg" style="align-self: flex-start; display: flex; gap: 10px; max-width: 640px; margin-top: 8px">
<span style="width: 26px; height: 26px; flex: 0 0 26px; border-radius: 999px; border: 2px solid #ef3124; box-sizing: border-box; display: flex; align-items: center; justify-content: center; margin-top: 2px" aria-hidden="true"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ef3124"></span></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 15px; line-height: 1.5; white-space: pre-line">{{ m.text }}</div>
<span style="font-size: 13px; color: #6b6b70">{{ m.time }}</span>
</div>
</div>
</template>
<template v-if="m.user">
<div class="msg" style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 520px; margin-top: 8px">
<div style="background: #f3f4f5; border-radius: 16px 16px 4px 16px; padding: 12px 16px; font-size: 15px; line-height: 1.45">{{ m.text }}</div>
<span style="font-size: 13px; color: #6b6b70">{{ m.time }}</span>
</div>
</template>
<template v-if="m.file">
<div class="msg" style="align-self: flex-end; display: flex; align-items: center; gap: 12px; border: 1px solid #dcdcdd; border-radius: 12px; padding: 10px 14px; background: #ffffff; margin-top: 8px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#13a463" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path><path d="M9 14l2 2 4-4"></path></svg>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{ m.text }}</span><span style="font-size: 12px; color: #6b6b70">CSV для расчёта по выписке</span></div>
</div>
</template>
</div></template>

<template v-if="v.thinking">
<div class="msg" style="align-self: flex-start; display: flex; align-items: center; gap: 10px; margin-top: 8px; color: #6b6b70; font-size: 14px">
<svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true" style="flex: 0 0 26px; overflow: visible"><circle cx="50" cy="50" r="34" fill="none" stroke="#fbe8e7" stroke-width="4"></circle><circle class="th-i1" cx="50" cy="50" r="6" fill="#ef3124" style="transform-origin: 50px 50px"></circle><circle class="th-i2" cx="50" cy="50" r="6" fill="#f6a59f" style="transform-origin: 50px 50px"></circle><circle class="th-i3" cx="50" cy="50" r="6" fill="#0b0b0c" style="transform-origin: 50px 50px"></circle><circle class="th-i4" cx="50" cy="50" r="6" fill="#ef3124" style="transform-origin: 50px 50px"></circle><circle class="th-i5" cx="50" cy="50" r="6" fill="#f6a59f" style="transform-origin: 50px 50px"></circle><circle class="th-puff" cx="50" cy="50" r="20" fill="#ef3124" style="transform-origin: 50px 50px"></circle></svg>
Думаю: сверяю с анкетой
</div>
</template>

<template v-if="v.showUpload">
<div class="msg" style="align-self: flex-start; width: 100%; max-width: 600px; margin: 8px 0 0 36px; border: 1px solid #dcdcdd; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
<span style="font-size: 16px; font-weight: 700">Выписка по расчётному счёту за 12 месяцев</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" class="ghost" @click="v.upload" style="min-height: 64px; border: 1px solid #dcdcdd; border-radius: 12px; background: #ffffff; font: 600 14px Manrope, sans-serif; cursor: pointer">Выбрать CSV</button>
<button type="button" class="ghost" @click="v.demoUpload" style="min-height: 64px; border: 1px solid #dcdcdd; border-radius: 12px; background: #ffffff; font: 600 14px Manrope, sans-serif; cursor: pointer">демо-выписка</button>
</div>
</div>
</template>

<template v-if="v.uploadError">
<button type="button" class="chip" @click="v.retryUpload" style="min-height: 40px; border: 0; border-radius: 999px; background: #fbe8e7; color: #b3241a; padding: 6px 14px; cursor: pointer">попробовать ещё раз</button>
</template>
<template v-if="v.analyzing">
<div class="msg" style="align-self: flex-start; width: 100%; max-width: 600px; margin: 8px 0 0 36px; border-radius: 16px; padding: 18px; background: #0b0b0c; color: #ffffff; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 14px">
<svg class="spin" width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="#2c2c2e" stroke-width="4"></circle><path d="M20 5a15 15 0 0 1 15 15" fill="none" stroke="#ef3124" stroke-width="4" stroke-linecap="round"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #a1a1a6">Расчёт по выписке</span>
<span style="font-size: 17px; font-weight: 700">Ждём ответ сервера</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<template v-for="(s, $index) in v.steps">
<span :style="`height: 6px; border-radius: 999px; background: ${s.c}`"></span>
</template>
</div>
<span style="font-size: 13px; color: #a1a1a6">Считает ядро по правилам банка. Нейросеть только объясняет.</span>
</div>
</template>

<template v-if="v.showAnswer">
<div class="msg" style="align-self: flex-start; width: 100%; max-width: 680px; margin: 8px 0 0 36px; border: 1px solid #dcdcdd; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
<span style="font-size: 22px; font-weight: 800">Можно после одного шага</span>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 12px; border-radius: 999px; background: linear-gradient(90deg, #0b0b0c 0 25%, #0072ef 25% 50%, #cb830f 50% 75%, #13a463 75% 100%)">
<span class="orbpos" style="position: absolute; left: 62%; top: -8px; width: 28px; height: 28px; margin-left: -14px; border-radius: 999px; background: #ffffff; border: 4px solid #cb830f; box-sizing: border-box; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.12)"></span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 12px; color: #6b6b70">
<span>Нужен менеджер</span><span>Другой инструмент</span><span style="color: #8a5a08; font-weight: 700">После шага</span><span style="text-align: right">Можно подавать</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">

<script src="petite-vue.iife.js"></script>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 'empty', thinking: false, step: 0, skill: null, voice: false, db: false, off: {}, call: false, callSec: 0, mute: false, messages: [] };
    this.timers = [];
  }
  componentWillUnmount() { if (this.requestController) this.requestController.abort(); this.timers.forEach(clearTimeout); clearInterval(this.callTimer); }
  startCall() { clearInterval(this.callTimer); this.setState({ call: true, callSec: 0, mute: false }); this.callTimer = setInterval(() => this.setState(s => ({ callSec: s.callSec + 1 })), 1000); }
  endCall() { clearInterval(this.callTimer); const sec = this.state.callSec; const t = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); this.setState({ call: false }); this.push({ agent: true, text: 'Итог звонка (' + t + '): обсудили платёж 17 ноября и задержку оплаты заказчика. Договорились: я готовлю черновик акта сверки, вы загружаете договор, лимит пересчитаю.' }); }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  now() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  push(m) { this.setState(s => ({ messages: s.messages.concat([Object.assign({ id: s.messages.length + 1, time: this.now() }, m)]) })); }
  ask(label) {
    if (this.state.stage !== 'empty' && this.state.stage !== 'answer') return;
    const first = this.state.stage === 'empty';
    this.push({ user: true, text: label });
    this.setState({ stage: 'thinking', thinking: true });
    this.later(() => {
      this.setState({ thinking: false, stage: first ? 'upload' : 'answer' });
      this.push({ agent: true, text: first
        ? 'Понял задачу. Посчитаю честно по выписке за 12 месяцев: так я увижу реальный поток, а не цифры на словах.'
        // уточнения после расчёта агент в демо пока не считает: без выдуманных цифр, только то, что дало ядро
        : 'Этот вопрос в демо пока не разбираю. Цифры выше посчитало ядро по выписке; чтобы обсудить детали, позовите менеджера.' });
    }, 1300);
  }
  upload() {
    if (this.state.stage === 'analyzing') return;
    document.getElementById('statement-file').click();
  }
  selectFile(event) {
    const file = event.target.files[0];
    event.target.value = '';
    if (file) this.scoreStatement(file);
  }
  async scoreStatement(file = null) {
    if (this.state.stage === 'analyzing') return;
    this.lastFile = file;
    const controller = new AbortController();
    this.requestController = controller;
    const timer = setTimeout(() => controller.abort(), 35000);
    this.setState({ stage: 'analyzing', thinking: false, uploadError: false, step: 0 });
    // полоса шагов идёт, пока ждём сервер: иначе застывшая 1/5 выглядит как зависание
    for (let i = 1; i < 5; i++) this.later(() => { if (this.state.stage === 'analyzing') this.setState({ step: i }); }, i * 700);
    try {
      let csv;
      if (file) {
        if (!file.name.toLowerCase().endsWith('.csv')) throw new Error('Выберите файл CSV.');
        if (file.size > 5 * 1024 * 1024) throw new Error('Файл слишком большой. Нужен CSV меньше 5 МБ.');
        csv = await file.text();
      } else {
        const demo = await fetch('../demo/cash_gap.csv', { signal: controller.signal });
        if (!demo.ok) throw new Error('Не удалось загрузить демо-выписку.');
        csv = await demo.text();
      }
      if (controller.signal.aborted) throw new DOMException('Timeout', 'AbortError');
      // Демонстрационные need и questionnaire; выписка передаётся из выбранного CSV.
      const body = { statement_csv: csv,
        need: { purpose: 'кассовый разрыв', amount_rub: 1500000, term_months: 12,
          repay_from: 'оплата по договору', asked_for: 'кредит' },
        questionnaire: { form: 'ООО', need: 'кассовый разрыв', sector: 'стройка', years: 'больше 3', trend: 'в плюс' },
        confirmed_fields: {}, history: [] };
      const response = await fetch('/api/score', { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: controller.signal });
      const result = await response.json().catch(() => null);
      // 5xx: шлюз и nginx отдают служебные коды (bad_gateway), клиенту только человеческий текст
      if (!response.ok) throw new Error(response.status < 500 && result && typeof result.error === 'string' ? result.error : 'Сервис расчёта временно недоступен. Попробуйте через минуту.');
      const view = result && result.view;
      if (!view || !view.numbers || typeof view.status_text !== 'string' || !Array.isArray(view.reasons)) throw new Error('Сервис вернул неполный ответ.');
      if (this.requestController !== controller) return;
      const rub = n => Number(n).toLocaleString('ru-RU') + ' ₽';
      const lines = [view.status_text, 'Инструмент: ' + view.instrument,
        'Лимит сейчас: ' + rub(view.numbers.available_now),
        'Лимит после шага: ' + rub(view.numbers.available_after),
        'Причины: ' + (view.reasons.map(r => r.text).join('; ') || 'дополнительных причин нет')];
      if (view.next_steps && view.next_steps.length) lines.push('Следующие шаги: ' + view.next_steps.map(s => s.text).join('; '));
      this.push({ file: true, text: file ? file.name : 'cash_gap.csv (демо)' });
      this.push({ agent: true, text: lines.join('\n') });
      this.setState({ stage: 'answer' });
    } catch (error) {
      if (this.requestController !== controller) return;
      this.push({ agent: true, text: error.name === 'AbortError'
        ? 'Расчёт не ответил за 35 секунд. Попробуйте ещё раз.'
        : (error instanceof TypeError ? 'Нет связи с сервером. Проверьте подключение и попробуйте ещё раз.' : error.message) });
      this.setState({ stage: 'upload', uploadError: true });
    } finally {
      clearTimeout(timer);
      if (this.requestController === controller) this.requestController = null;
    }
  }
  reset() { if (this.requestController) this.requestController.abort(); this.requestController = null; this.lastFile = null; this.setState({ uploadError: false }); this.timers.forEach(clearTimeout); this.timers = []; this.setState({ stage: 'empty', thinking: false, step: 0, skill: null, voice: false, messages: [] }); }
  renderVals() {
    const st = this.state.stage;
    const skillDefs = [
      { id: 'vyp', img: 'img/skill-vypiska.svg', title: 'Разбор выписки', sub: 'поток, разрывы, сезон', tint: '#fbe8e7', ink: '#ef3124', icon: 'M6 3h8l4 4v14H6zM9 12h6M9 16h4' },
      { id: 'pay', img: 'img/skill-platezh.svg', title: 'Потяну ли платёж', sub: 'стресс −30% по месяцам', tint: '#fbe8e7', ink: '#0b6b40', icon: 'M4 18l5-6 4 3 7-9M15 6h5v5' },
      { id: 'inn', img: 'img/skill-kontragent.svg', title: 'Проверка контрагента', sub: 'по ИНН перед сделкой', tint: '#fbe8e7', ink: '#0058b8', icon: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4' },
      { id: 'tax', img: 'img/skill-nalogi.svg', title: 'Налоговый календарь', sub: 'УСН и НДС без пени', tint: '#fbe8e7', ink: '#8a5a08', icon: 'M4 6h16v14H4zM4 10h16M9 3v5M15 3v5' }
    ];
    const skills = skillDefs.map(k => Object.assign({}, k, {
      bg: this.state.skill === k.id ? '#fbe8e7' : 'transparent',
      pick: () => { this.setState({ skill: k.id }); this.ask(k.title + ': помоги'); }
    }));
    const startChips = ['Нужны деньги на закупку', 'Кассовый разрыв', 'Потяну ли кредит'];
    const nextChips = ['А если заказчик задержит оплату?', 'Что за документ нужен', 'Сравнить с лизингом'];
    const labels = ['Читаем выписку', 'Поток по месяцам', 'Крупнейший плательщик', 'Стресс: выручка −30%', 'Сверяем с условиями банка'];
    const flowRaw = [62, 70, 48, -18, 55, 80, 74, 66, -10, 58, 84, 77];
    const cur = skillDefs.find(k => k.id === this.state.skill);
    const off = this.state.off;
    const dbRaw = [{ name: 'Деньги и поток', items: [{ id: 'vyp', title: 'Разбор выписки', sub: 'поток, разрывы, сезонность', img: 'img/skill-vypiska.svg' },{ id: 'pay', title: 'Потяну ли платёж', sub: 'стресс −30% по месяцам', img: 'img/skill-platezh.svg' },{ id: 'gap', title: 'Прогноз разрыва', sub: 'когда не хватит и сколько', img: 'img/goal-razryv.svg' }] },{ name: 'Кредит и альтернативы', items: [{ id: 'lease', title: 'Лизинг или кредит', sub: 'что дешевле под вашу задачу', img: 'img/skill-lizing.svg' },{ id: 'fact', title: 'Факторинг', sub: 'деньги за отсрочку заказчика', img: 'img/feed-postuplenie.svg' },{ id: 'cfa', title: 'ЦФА', sub: 'привлечь деньги от инвесторов', img: 'img/feed-limit.svg' },{ id: 'lgot', title: 'Льготные программы', sub: 'госпрограммы для МСП', img: 'img/skill-lgoty.svg' }] },{ name: 'Сделки и контрагенты', items: [{ id: 'inn', title: 'Проверка контрагента', sub: 'по ИНН перед сделкой', img: 'img/skill-kontragent.svg' },{ id: 'gar', title: 'Гарантия под госзакупку', sub: 'для тендера и контракта', img: 'img/skill-garantiya.svg' },{ id: 'act', title: 'Акт сверки письмом', sub: 'черновик заказчику', img: 'img/feed-novosti.svg' }] },{ name: 'Налоги и бухгалтерия', items: [{ id: 'tax', title: 'Налоговый календарь', sub: 'УСН и НДС без пени', img: 'img/skill-nalogi.svg' },{ id: 'buh', title: 'Выгрузка бухгалтеру', sub: 'папка документов за период', img: 'img/goal-goskontrakt.svg' }] }];
    const dbGroups = dbRaw.map(g => ({ name: g.name, items: g.items.map(it => { const on = !off[it.id]; return Object.assign({}, it, { on: on ? 'true' : 'false', track: on ? '#13a463' : '#dcdcdd', knob: on ? '23px' : '3px', toggle: () => this.setState(s => ({ off: Object.assign({}, s.off, { [it.id]: on }) })) }); }) }));
    const dbOn = dbRaw.reduce((n, g) => n + g.items.filter(it => !off[it.id]).length, 0);
    return {
      skills,
      history: [
        { title: 'Кассовый разрыв, октябрь', when: '12:40', bg: 'transparent' },
        { title: 'Закупка материалов под сезон', when: 'вчера', bg: 'transparent' },
        { title: 'Какие документы нужны', when: '12 окт', bg: 'transparent' },
        { title: 'Лизинг экскаватора', when: '9 окт', bg: 'transparent' }
      ],
      messages: this.state.messages,
      isEmpty: st === 'empty',
      chatTitle: st === 'empty' ? (this.props.agentName ?? 'Кредитный агент') : (this.props.agentName ?? 'Кредитный агент') + ' · кассовый разрыв',
      statusLine: this.state.thinking || st === 'analyzing' ? 'думает' : 'на связи, видит вашу выписку и анкету',
      mascotClass: this.state.thinking || st === 'analyzing' ? 'spin' : 'idle',
      thinking: this.state.thinking,
      showUpload: st === 'upload',
      analyzing: st === 'analyzing',
      stepNo: this.state.step + 1,
      stepLabel: labels[this.state.step],
      steps: labels.map((l, i) => ({ c: i <= this.state.step ? '#ef3124' : '#2c2c2e' })),
      showAnswer: false, // Результат API показан в сообщениях, статическая карточка скрыта.
      showChips: st === 'empty' || st === 'answer',
      chips: (st === 'empty' ? startChips : nextChips).map(label => ({ label, pick: () => this.ask(label) })),
      flow: flowRaw.map((x, i) => ({ h: Math.max(Math.abs(x), 8) + 'px', c: x < 0 ? '#d91d0b' : '#13a463', delay: (i * 40) + 'ms' })),
      hasSkill: !!cur, skillName: cur ? cur.title : '',
      clearSkill: () => this.setState({ skill: null }),
      voice: this.state.voice,
      inCall: this.state.call,
      callTime: Math.floor(this.state.callSec / 60) + ':' + String(this.state.callSec % 60).padStart(2, '0'),
      callLines: [
        { who: 'Вы', ink: '#a1a1a6', text: 'Заказчик опять тянет с оплатой, ноябрьский платёж потяну?' },
        { who: 'Агент', ink: '#ef3124', text: 'Потянете, запас около 38 000 ₽. Но если задержка больше месяца, лучше заранее отложить часть поступлений.' },
        { who: 'Вы', ink: '#a1a1a6', text: 'А если взять факторинг?' },
        { who: 'Агент', ink: '#ef3124', text: 'Посчитаю оба варианта и пришлю в чат после звонка.' }
      ].slice(0, Math.min(4, 1 + Math.floor(this.state.callSec / 3))),
      muteBg: this.state.mute ? '#ffffff' : '#202022', muteInk: this.state.mute ? '#0b0b0c' : '#ffffff', muteLabel: this.state.mute ? 'Включить микрофон' : 'Выключить микрофон',
      toggleMute: () => this.setState(s => ({ mute: !s.mute })),
      startCall: () => this.startCall(), endCall: () => this.endCall(),
      showDb: this.state.db, dbGroups, dbOn,
      openDb: () => this.setState({ db: true }), closeDb: () => this.setState({ db: false }),
      toggleVoice: () => this.setState(s => ({ voice: !s.voice })),
      upload: () => this.upload(),
      selectFile: event => this.selectFile(event),
      demoUpload: () => this.scoreStatement(),
      uploadError: !!this.state.uploadError,
      retryUpload: () => this.scoreStatement(this.lastFile),
      reset: () => this.reset()
    };
  }
}
mountDC(Component, {"agentName": "Кредитный агент"});
</script>
