body{margin:0;background:#f3f4f5}
a{color:#0072ef}a:hover{color:#005bbf}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes txtIn{0%,38%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@keyframes turn{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(90deg)}100%{transform:rotate(0)}}
@keyframes pop{0%,45%{transform:scale(1)}55%,95%{transform:scale(.55)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes ring{from{stroke-dashoffset:176}}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.wid > span, .wid > svg{animation:txtIn 1.3s cubic-bezier(.16,1,.3,1) both;animation-delay:inherit}
.t1{animation:turn 6s ease-in-out infinite}.t2{animation:turn 6s 1.5s ease-in-out infinite}.t3{animation:turn 6s 3s ease-in-out infinite}
.p1{animation:pop 5s ease-in-out infinite}.p2{animation:pop 5s 1.2s ease-in-out infinite}.p3{animation:pop 5s 2.4s ease-in-out infinite}
.line{stroke-dasharray:400;animation:draw 1.6s .3s cubic-bezier(.4,0,.2,1) both}
.ringv{animation:ring 1.4s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideOrb{from{left:0%}}
@keyframes hb{from{transform:scaleY(0)}}
.orbpos{animation:slideOrb 1.2s .6s cubic-bezier(.2,.8,.2,1) both}
.hb{transform-origin:bottom;animation:hb .7s .5s cubic-bezier(.2,.8,.2,1) both}
.wid:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 28px rgba(0,0,0,.08)}
.wid{transition:transform .2s ease,box-shadow .2s ease}
.opt:hover{border-color:#ef3124}
.ghost:hover{background:#f3f4f5}
.cta:hover{background:#d92a1e}
@media (prefers-reduced-motion: reduce){.wid > span,.wid > svg{animation:none}.rise,.t1,.t2,.t3,.p1,.p2,.p3,.line,.ringv,.orbpos,.hb{animation:none}.wid{transition:none}}
.seg:not([aria-current]):hover{background:#e4e4e6!important}
</style>
<style>[v-cloak]{display:none}</style>
