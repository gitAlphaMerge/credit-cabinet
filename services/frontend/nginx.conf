server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    # DNS докера на каждый запрос: api перезапустился с новым IP, nginx не держит старый
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/agent/turn {
        if ($request_method != POST) { return 405; }
        client_max_body_size 64k;
        set $agent http://agent:8090;
        rewrite ^ /turn break;
        proxy_pass $agent;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @agent_down;
    }

    location @agent_down {
        default_type application/json;
        return 502 '{"error":"agent_unavailable"}';
    }

    location /api/ {
        set $api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;   # меньше 35 с браузера: ответ nginx успевает раньше обрыва
        proxy_intercept_errors off;
        error_page 413 = @too_large;
        error_page 502 503 504 = @api_down;
    }

    # ошибки самого nginx тоже JSON: фронт и smoke ждут {"error": ...}, а не HTML-страницу
    location @api_down {
        default_type application/json;
        return 502 '{"error":"bad_gateway","detail":"сервис расчёта недоступен, попробуйте через минуту"}';
    }
    location @too_large {
        default_type application/json;
        return 413 '{"error":"too_large","detail":"выписка больше 5 МБ"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
