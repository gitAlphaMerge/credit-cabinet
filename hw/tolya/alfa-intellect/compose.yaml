services:
  alfa-intellect:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/var/alfa.sqlite
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4-mini}
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      TEAM_API_URL: ${TEAM_API_URL:-http://host.docker.internal:8080}
    volumes:
      - alfa_data:/app/var
    mem_limit: 256m
volumes:
  alfa_data:
