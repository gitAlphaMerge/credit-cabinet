body{margin:0;background:#f3f4f5}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:none}}
@keyframes innerIn{0%,30%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:none}}
@keyframes capIn{0%,45%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes orbBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spinS{to{transform:rotate(360deg)}}
@keyframes slideOrb{from{left:0%}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
.inner{animation:innerIn 1.4s cubic-bezier(.16,1,.3,1) both;animation-delay:inherit}
.cap{animation:capIn 1.5s cubic-bezier(.16,1,.3,1) both;animation-delay:inherit}
.bob{animation-duration:3.4s!important}
.bob{animation:bob 2.6s ease-in-out infinite}
.spinS{animation:spinS 8s linear infinite}
.orbpos{transition:left 1.2s cubic-bezier(.16,1,.3,1);animation:orbBreath 2.6s ease-in-out infinite}
.fade{animation:fade .4s ease both}
@media (prefers-reduced-motion: reduce){.rise,.bob,.spinS,.fade,.inner,.cap,.orbpos{animation:none}.orbpos{transition:none}}
@keyframes pushBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes propIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes scan{0%{top:-26px}100%{top:190px}}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes lens{0%,100%{transform:translate(0,0)}35%{transform:translate(96px,30px)}65%{transform:translate(150px,44px)}}
@keyframes drawL{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes drawC{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes popIn{0%,60%{transform:scale(0)}100%{transform:scale(1)}}
.pushBob{animation:pushBob 3.2s cubic-bezier(.45,0,.55,1) infinite}
.propIn{animation:propIn .8s cubic-bezier(.16,1,.3,1) both}
.scan{animation:scan 1.6s cubic-bezier(.45,0,.55,1) infinite}
.barUp{transform-origin:bottom;animation:barUp .9s cubic-bezier(.16,1,.3,1) both}
.lens{animation:lens 2.6s cubic-bezier(.45,0,.55,1) infinite}
.drawL{stroke-dasharray:300;animation:drawL 1.2s cubic-bezier(.16,1,.3,1) both}
.drawC{stroke-dasharray:420;animation:drawC 1s cubic-bezier(.16,1,.3,1) both;transform:rotate(-90deg);transform-origin:85px 85px}
.drawK{stroke-dasharray:120;animation:drawL 1.4s cubic-bezier(.16,1,.3,1) both}
.popIn{transform-origin:250px 112px;animation:popIn 1.2s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){.pushBob,.propIn,.scan,.barUp,.lens,.drawL,.drawC,.drawK,.popIn{animation:none}}
</style>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { scene: 0, step: 0, serverSteps: [] }; }
  componentDidMount() {
    this.sceneTimer = setInterval(() => this.setState(s => ({ scene: (s.scene + 1) % 3 })), 5400);
    if (embedded) {
      // Never turn an illustration timer into claimed application progress.
      this.progressListener = (event) => {
        if (event.origin !== location.origin || event.source !== parent || event.data?.type !== 'credit-loading-progress') return;
        const input = event.data.steps;
        if (!Array.isArray(input) || input.length > 30 || !input.every(s => s && typeof s.label === 'string' && ['pending', 'running', 'done', 'error', 'waiting-data'].includes(s.status))) return;
        const steps = input.map(s => ({label: s.label.slice(0, 200), status: s.status}));
        const active = steps.findIndex(s => ['running', 'error', 'waiting-data'].includes(s.status));
        const done = steps.filter(s => s.status === 'done').length;
        this.setState({serverSteps: steps, step: Math.min(4, Math.max(0, active < 0 ? done : active))});
      };
      window.addEventListener('message', this.progressListener);
      this.resizeObserver = new ResizeObserver(() => parent.postMessage({type: 'credit-loading-height', height: document.getElementById('app').getBoundingClientRect().height}, location.origin));
      this.resizeObserver.observe(document.getElementById('app'));
      return;
    }
    this.stepTimer = setInterval(() => this.setState(s => ({ step: (s.step + 1) % 5 })), 2600);
  }
  componentWillUnmount() { clearInterval(this.sceneTimer); clearInterval(this.stepTimer); window.removeEventListener('message', this.progressListener); this.resizeObserver?.disconnect(); }
  renderVals() {

        ['Закупил металл под объект', [sh('18%', '58%', '64%', '12%', K, '999px'), sh('22%', '42%', '56%', '12%', R, '999px', { anim: 'bob' }), sh('26%', '26%', '48%', '12%', P, '999px')]],
        ['Смонтировал крышу', [sh('20%', '18%', '60%', '38%', R, '0', { clip: 'polygon(50% 0, 100% 100%, 0 100%)' }), sh('28%', '56%', '44%', '30%', K, '6px'), sh('44%', '66%', '12%', '20%', S, '4px')]],
        ['Подписал акт с заказчиком', [sh('30%', '14%', '40%', '62%', W, '10px', { border: '3px solid #0b0b0c' }), sh('38%', '30%', '24%', '6%', K, '999px'), sh('52%', '58%', '30%', '30%', 'transparent', '999px', { border: '7px solid #13a463', anim: 'bob' })]],
        ['Заказчик оплатил, платёж по кредиту закрыт', [sh('16%', '46%', '30%', '36%', R, '999px', { anim: 'bob' }), sh('40%', '30%', '30%', '36%', P, '999px'), sh('62%', '18%', '22%', '26%', K, '999px')]]
      ] },
      { title: 'Селлер маркетплейса: партия к сезону', tiles: [
        ['Закупил партию у поставщика', [sh('16%', '50%', '30%', '32%', R, '6px'), sh('50%', '50%', '30%', '32%', K, '6px'), sh('33%', '16%', '30%', '32%', P, '6px', { anim: 'bob' })]],
        ['Отгрузил на склад площадки', [sh('12%', '34%', '62%', '30%', K, '10px'), sh('74%', '42%', '16%', '22%', R, '6px'), sh('20%', '66%', '16%', '18%', P, '999px'), sh('56%', '66%', '16%', '18%', P, '999px')]],
        ['Продажи пошли', [sh('16%', '62%', '14%', '24%', P, '6px 6px 0 0'), sh('36%', '46%', '14%', '40%', R, '6px 6px 0 0'), sh('56%', '30%', '14%', '56%', K, '6px 6px 0 0', { anim: 'bob' }), sh('76%', '18%', '10%', '68%', G, '6px 6px 0 0')]],
        ['Выплата от площадки раз в неделю', [sh('30%', '24%', '40%', '48%', 'transparent', '999px', { border: '10px solid #ef3124', anim: 'bob' }), sh('44%', '40%', '12%', '16%', K, '999px')]]
      ] },
      { title: 'Кафе: сезон и тихий январь', tiles: [
        ['Закупка продуктов на неделю', [sh('18%', '40%', '64%', '40%', K, '0 0 999px 999px'), sh('30%', '22%', '18%', '18%', R, '999px', { anim: 'bob' }), sh('52%', '18%', '18%', '22%', P, '999px')]],
        ['Летом полный зал', [sh('12%', '30%', '22%', '22%', R, '999px'), sh('40%', '30%', '22%', '22%', R, '999px', { anim: 'bob' }), sh('68%', '30%', '22%', '22%', R, '999px'), sh('12%', '62%', '78%', '10%', K, '999px')]],
        ['В январе выручка проседает', [sh('16%', '22%', '14%', '62%', K, '6px 6px 0 0'), sh('36%', '40%', '14%', '44%', P, '6px 6px 0 0'), sh('56%', '62%', '14%', '22%', R, '6px 6px 0 0', { anim: 'bob' }), sh('76%', '54%', '10%', '30%', P, '6px 6px 0 0')]],
        ['Агент заранее советует отложить', [sh('22%', '24%', '56%', '52%', S, '20px'), sh('34%', '36%', '32%', '28%', 'transparent', '999px', { border: '8px solid #13a463', anim: 'bob' })]]
      ] }
    ];
    const sc = scenes[this.state.scene];
    const mk = (sce) => sce.tiles.map(([caption, shapes], i) => ({ n: i + 1, caption, shapes, ground: ['#fbe8e7', '#f3f4f5', '#fbe8e7', '#f3f4f5'][i], delay: (i * 180) + 'ms' }));
    const grounds = ['#fbe8e7', '#f3f4f5', '#fbe8e7', '#f3f4f5'];
    const tiles = sc.tiles.map(([caption, shapes], i) => ({ n: i + 1, caption, shapes, ground: grounds[i], delay: (i * 110) + 'ms' }));
    const labels = ['Читаем выписку', 'Поток по месяцам', 'Крупнейший плательщик', 'Стресс: выручка −30%', 'Сверяем с условиями банка'];
    const step = this.state.step;
    const serverSteps = this.state.serverSteps;
    const completed = serverSteps.filter(s => s.status === 'done').length;
    const active = serverSteps.findIndex(s => ['running', 'error', 'waiting-data'].includes(s.status));
    const current = serverSteps[active];
    const percent = serverSteps.length ? Math.round(completed / serverSteps.length * 100) : 0;
    return {
      sceneTitle: sc.title, tiles,
      tiles0: mk(scenes[0]), tiles1: mk(scenes[1]), tiles2: mk(scenes[2]),
      isPush: (this.props.visual ?? 'Пуш-аналитик') === 'Пуш-аналитик', isScenes: (this.props.visual ?? 'Пуш-аналитик') === 'сценки',
      isP0: step === 0, isP1: step === 1, isP2: step === 2, isP3: step === 3, isP4: step === 4,
      isS0: this.state.scene === 0, isS1: this.state.scene === 1, isS2: this.state.scene === 2,
      dots: scenes.map((s, i) => ({ label: s.title, w: i === this.state.scene ? '32px' : '10px', c: i === this.state.scene ? '#ef3124' : '#dcdcdd', pick: () => this.setState({ scene: i }) })),
      totalSteps: embedded ? serverSteps.length : 5,
      stepCaption: embedded ? (serverSteps.length ? `Завершено ${completed} из ${serverSteps.length} этапов` : 'Готовим рассмотрение') : `Шаг ${step + 1} из 5`,
      progressNote: embedded ? (current?.status === 'error' ? 'Не удалось завершить проверку. Обновите статус заявки.' : current?.status === 'waiting-data' ? 'Для продолжения нужны дополнительные сведения.' : 'Статус обновляется по результатам рассмотрения заявки.') : 'Предпросмотр анимации загрузки.',

      steps: embedded ? serverSteps.map(s => ({c: s.status === 'done' ? '#ef3124' : '#f3f4f5'})) : labels.map((l, i) => ({ c: i <= step ? '#ef3124' : '#f3f4f5' })),
      orbLeft: embedded ? (serverSteps.length ? (Math.min(active < 0 ? completed : active, serverSteps.length - 1) + 0.5) / serverSteps.length * 100 : 0) + '%' : ((step + 0.5) / 5 * 100) + '%'
    };
  }
