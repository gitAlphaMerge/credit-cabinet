<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пуш · живая сборка загрузки</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f5;font:15px Manrope,Arial,sans-serif;color:#151517}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #dedede;background:#fff}header b{font-size:17px}header span{font-size:12px;color:#6b6b70}main{min-height:calc(100svh - 66px);position:relative;display:grid;place-items:center;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.72}article{position:relative;z-index:1;text-align:center;background:#f3f4f5eb;padding:36px 52px;border-radius:24px;max-width:calc(100% - 32px)}img{width:260px;max-width:72vw;display:block;margin:auto;animation:float 3.4s ease-in-out infinite}h1{font-size:30px;letter-spacing:-.04em;margin:18px 0 8px}p{color:#6b6b70;margin:0;line-height:1.6}button{margin-top:24px;background:#ef3124;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer;font:inherit}.note{font-size:12px;margin-top:16px}@keyframes float{50%{transform:translateY(-10px) rotate(2deg)}}@media(prefers-reduced-motion:reduce){img{animation:none}}
</style></head><body><header><b>Альфа-Бизнес · Пуш</b><span>Живой предпросмотр</span></header><main><canvas aria-hidden="true"></canvas><article><img src="img/push.png" alt="Пуш, помощник Альфа-Бизнеса"><h1>Собираем всё по частицам</h1><p>Пуш готовит ваше рабочее пространство</p><button id="replay">Собрать ещё раз</button><p class="note">Подвигайте курсором рядом с узором</p></article></main><script type="module">import {mountLoadingPattern} from './loading-pattern.js';let dispose=mountLoadingPattern(document.querySelector('canvas'));document.querySelector('#replay').onclick=()=>{dispose();dispose=mountLoadingPattern(document.querySelector('canvas'))};</script></body></html>
