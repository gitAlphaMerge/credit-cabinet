<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="Агент: голосовой ввод превращается в волну">
<style>:root{--bg:#f3f4f5;--card:#fff;--ink:#0b0b0c;--ink2:#6b6b70;--line:#dcdcdd;--rs:#fbe8e7;--rt:#b8200f;--bs:#d6e8fc;--bt:#0058b8}@media (prefers-color-scheme:dark){:root{--bg:#0e0e10;--card:#18181b;--ink:#f2f2f3;--ink2:#9a9aa2;--line:#2c2c30;--rs:#3a1714;--rt:#ff7a6e;--bs:#12233a;--bt:#7fb6ff}}text{font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif}.bg{fill:var(--bg)}.card{fill:var(--card)}.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.rt{fill:var(--rt)}.bt{fill:var(--bt)}.rs{fill:var(--rs)}.bs{fill:var(--bs)}.line{fill:var(--line)}
.mic{animation:mic 6s ease-in-out infinite}
.wave rect{animation:wv 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ring{animation:ring 6s ease-out infinite;transform-origin:1050px 130px}
.m1{animation:msg 6s ease-in-out infinite}.m2{animation:msg 6s ease-in-out infinite 1.2s}
@keyframes mic{0%,30%{opacity:1}38%,88%{opacity:0}100%{opacity:1}}
@keyframes wv{0%,32%{transform:scaleY(.1);opacity:0}40%{opacity:1}45%{transform:scaleY(1)}55%{transform:scaleY(.35)}65%{transform:scaleY(.9)}75%{transform:scaleY(.5)}86%{transform:scaleY(.8);opacity:1}92%,100%{transform:scaleY(.1);opacity:0}}
@keyframes ring{0%,30%{transform:scale(1);opacity:.35}60%{transform:scale(1.35);opacity:0}100%{opacity:0}}
@keyframes msg{0%,10%{opacity:0;transform:translateY(8px)}20%,90%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/></filter></defs>
<rect class="bg" width="1280" height="260" rx="28"/>

<text x="64" y="56" class="ink" font-size="22" font-weight="800">Агент рядом на каждом шаге</text>
<text x="64" y="84" class="ink2" font-size="15" font-weight="500">Спрашивает недостающее, объясняет цифры ядра и не продаёт кредит любой ценой.</text>
<g class="m1"><g filter="url(#sh)"><rect x="64" y="110" width="430" height="52" rx="16" class="card"/></g>
<text class="ink" x="84" y="142" font-size="15" font-weight="600">Почему лимит 1 015 000, а не полтора миллиона?</text></g>
<g class="m2"><rect x="140" y="176" width="560" height="60" rx="16" class="bs"/>
<text class="bt" x="160" y="201" font-size="14" font-weight="700">Не хватает договора с крупным заказчиком.</text>
<text class="bt" x="160" y="222" font-size="14" font-weight="500">Подтвердите его, и лимит пересчитается до 1 523 000 ₽.</text></g>
<circle class="ring" cx="1050" cy="130" r="64" fill="#ef3124"/>
<circle cx="1050" cy="130" r="64" fill="#ef3124" fill-opacity=".08" stroke="#ef3124" stroke-opacity=".35" stroke-width="2"/>
<g class="mic" fill="#ef3124"><rect x="1040" y="98" width="20" height="38" rx="10"/>
<path d="M1028 126a22 22 0 0 0 44 0" fill="none" stroke="#ef3124" stroke-width="4" stroke-linecap="round"/>
<rect x="1048" y="148" width="4" height="12" rx="2"/></g>
<g class="wave" fill="#ef3124"><rect x="995" y="121.0" width="6" height="18" rx="3" style="animation-delay:0.00s"/><rect x="1006" y="113.0" width="6" height="34" rx="3" style="animation-delay:0.06s"/><rect x="1017" y="104.0" width="6" height="52" rx="3" style="animation-delay:0.12s"/><rect x="1028" y="110.0" width="6" height="40" rx="3" style="animation-delay:0.18s"/><rect x="1039" y="100.0" width="6" height="60" rx="3" style="animation-delay:0.24s"/><rect x="1050" y="108.0" width="6" height="44" rx="3" style="animation-delay:0.30s"/><rect x="1061" y="116.0" width="6" height="28" rx="3" style="animation-delay:0.36s"/><rect x="1072" y="105.0" width="6" height="50" rx="3" style="animation-delay:0.42s"/><rect x="1083" y="112.0" width="6" height="36" rx="3" style="animation-delay:0.48s"/><rect x="1094" y="119.0" width="6" height="22" rx="3" style="animation-delay:0.54s"/></g>
<text x="1050" y="226" text-anchor="middle" class="ink2" font-size="13" font-weight="600">голос: круг → волна</text>

</svg>
