services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - ML_URL=http://ml-model:5000
      - PORT=8080
    depends_on:
      ml-model:
        condition: service_started
    networks:
      - internal-net

  ml-model:
    build:
feature/artem-proxy-wire
      context: ./ml-model
      dockerfile: Dockerfile
    expose:
      - "5000"
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
      context: .
      dockerfile: services/ml-model/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # только с этой машины: снаружи кухня закрыта
    volumes:
      - journal:/app/journal
    mem_limit: 384m

  frontend:
    build: ./services/frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    mem_limit: 64m

volumes:
  journal:
