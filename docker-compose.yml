version: "3.8"

services:
  api:
    build: ./services/api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ML_URL=http://ml-model:5000
    depends_on:
      - ml-model
    deploy:
      resources:
        limits:
          memory: 100M

  ml-model:
    build: ./services/ml-model
    expose:
      - "5000" # Заменяем ports на expose, чтобы сервис был доступен только внутри сети Docker
    deploy:
      resources:
        limits:
          memory: 500M

  agent:
    build: ./services/agent
    env_file:
      - .env
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
    deploy:
      resources:
        limits:
          memory: 150M

  # frontend и другие сервисы по аналогии