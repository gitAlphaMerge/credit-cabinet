version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - ML_URL=http://ml-model:5000
      - PORT=8080
    depends_on:
      ml-model:
        condition: service_started
    networks:
      - internal-net

  ml-model:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    expose:
      - "5000"
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge