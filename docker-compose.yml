services:
  api:
    restart: unless-stopped
    build: ./services/api
    ports:
      - "8080:8080"
    environment:
      - ML_URL=http://ml-model:5000   # провод Тёмы: /score уходит в окошко
      - PORT=8080
    depends_on:
      ml-model:
        condition: service_started   # api живёт и без ядра: отдаёт 502 JSON, а не молчит
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m

  ml-model:
    build:
      context: .
      dockerfile: services/ml-model/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # только с этой машины: снаружи кухня закрыта
    environment:
      - CORE_ID=liza
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - journal:/app/journal
    mem_limit: 384m

  frontend:
    restart: unless-stopped
    build: ./services/frontend
    depends_on:
      api:
        condition: service_started   # статика встаёт всегда, даже если api лежит
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-80}:80"
    mem_limit: 64m

volumes:
  journal:
