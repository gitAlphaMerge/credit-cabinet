services:
  api:
    build: ./services/api
    ports:
      - "8080:8080"
    mem_limit: 64m

  ml-model:
    build:
      context: .
      dockerfile: services/ml-model/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # только с этой машины: снаружи кухня закрыта
    volumes:
      - journal:/app/journal
    mem_limit: 384m

  frontend:
    build: ./services/frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    mem_limit: 64m

volumes:
  journal:
